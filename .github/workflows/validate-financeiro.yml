name: Validate Financeiro COSTALOG

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/dss-financeiro-api-segura]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit (report only)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs -e 'const a=require("/tmp/npm-audit.json"); const v=a.metadata?.vulnerabilities || {}; console.log("npm audit summary:", JSON.stringify(v)); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(`${item.severity}: ${name}; direct=${item.isDirect}; fix=${JSON.stringify(item.fixAvailable)}`);'
      - name: TypeScript check
        run: npm run lint
      - name: Build frontend
        run: npm run build
